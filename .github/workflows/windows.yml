name: windows
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rakudo
        uses: Raku/setup-raku@v1
      - name: Install dependencies and test
        run: |
          zef install --/test --test-depends --deps-only .
          zef test .
